on:
  push:
    branches: [main]
    paths:
      - super_native_extensions/hook/**
      - .github/workflows/prebuilt_smoke.yml
  workflow_dispatch:

name: Prebuilt Smoke Test

# Builds the example app on every platform with Rust removed from the runner,
# proving the default build only downloads prebuilt binaries.

permissions:
  contents: read

jobs:
  Smoke:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: apk, os: ubuntu-latest }
          - { target: linux, os: ubuntu-latest }
          - { target: macos, os: macos-latest }
          - { target: ios --simulator, os: macos-latest }
          - { target: windows, os: windows-latest }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Remove Rust
        run: |
          rm -rf ~/.cargo ~/.rustup
          if command -v cargo; then echo "cargo is still on PATH"; exit 1; fi
      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - working-directory: super_clipboard/example
        run: flutter build ${{ matrix.target }} --debug
